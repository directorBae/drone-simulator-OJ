<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>드론으로 배우는 Physical AI — Drone Lab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing">
  <main class="land-wrap">
    <div class="land-kicker">인공지능학과 특강 · URANUS</div>
    <h1>드론으로 배우는 <span>Physical AI</span></h1>
    <p class="land-sub">시리얼 통신부터 군집 3D 경로 생성까지</p>
    <div class="cards">
      <a class="card day" href="day1/">
        <div class="card-k">1일차 · 11.27 (금)</div>
        <h2>내 코드로 드론 띄우기</h2>
        <p>파이썬으로 MAVLink 메시지를 보내 가상 드론을 움직이고, LED 를 켜고, 돌아오는 메시지를 확인합니다.</p>
        <span class="go">실습 시작 →</span>
      </a>
      <a class="card day" id="day2Card" href="day2/">
        <div class="card-k">2일차 · 12.4 (금)</div>
        <h2>드론 20대, 충돌 없이 가장 빠르게</h2>
        <p>군집 경로 생성 알고리즘을 구현해 제출하면 온라인 저지가 채점하고 실시간 스코어보드에 반영합니다.</p>
        <span class="go" id="day2Go">불러오는 중…</span>
      </a>
    </div>
    <p class="land-foot"><a href="leaderboard/">🏆 스코어보드</a> · <a href="admin/">관리자</a></p>
  </main>
  <script>
    fetch('api/config').then((r) => r.json()).then((c) => {
      const go = document.getElementById('day2Go'), card = document.getElementById('day2Card');
      if (c.day2Open || c.admin) go.textContent = c.day2Open ? '로그인하고 시작 →' : '관리자 미리보기 →';
      else { card.classList.add('locked'); go.textContent = '🔒 ' + new Date(c.day2OpenAt).toLocaleString('ko-KR') + ' 공개'; card.removeAttribute('href'); }
    }).catch(() => { document.getElementById('day2Go').textContent = '서버에 연결할 수 없습니다 (1일차는 이용 가능)'; });
  </script>
</body>
</html>
