services:
  droneoj:
    build: .
    restart: unless-stopped
    ports:
      - "80:8080"   # HTTP
      - "443:8443"  # HTTPS (Cloudflare → 원본 서버 구간 암호화)
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?.env 파일에 ADMIN_PASSWORD=비밀번호 를 넣으세요}" # 값은 .env 에 (git 에 올리지 않음)
      # HTTPS 로 들어온 요청의 로그인 쿠키는 자동으로 Secure. 항상 Secure 로 하려면 .env 에 COOKIE_SECURE=1
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      # JUDGE_WORKERS: "3"                    # 동시에 채점하는 제출 수 (기본: CPU 수 − 1, 최대 4)
      # JUDGE_TIMEOUT_SEC: "30"               # 케이스당 경로 계산 시간 제한
      # JUDGE_MEM_MB: "1024"                  # 학생 프로그램 메모리 제한
    cap_add:
      - NET_ADMIN # 학생 코드(sandbox 사용자)의 네트워크를 iptables 로 막는 데만 씀
    volumes:
      - ./data:/data # SQLite DB (학생 계정 · 코드 · 제출)
      - ./certs:/certs # HTTPS 인증서 (없으면 처음 켤 때 자체 서명 인증서를 만듦) — git 에 올리지 않음
